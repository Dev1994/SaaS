# Rotate container logs so they cannot fill the Pi's disk (default json-file driver grows forever).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # SaffaApi - exports traces, metrics and logs to the shared OTel collector
  # (Docker-Raspberry-PI-Monitoring) over the monitoring network.
  saffaapi:
    logging: *default-logging
    build:
      context: ./SaffaApi
      dockerfile: Dockerfile
    container_name: saffa-api
    # No published ports: the Cloudflare tunnel (volkwyn-cloudflared-tunnel) reaches the API as
    # http://saffa-api:8080 over the shared cloudflared network, so it is not exposed on the LAN.
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # service.name / service.version resource attributes (read by AddSaffaOpenTelemetry).
      - OpenTelemetry__ServiceName=SaffaApi
      - OpenTelemetry__ServiceVersion=1.0.0
      # Telemetry is only exported when this is set.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./SaffaApi/data:/app/data
    networks:
      - monitoring
      - tunnel
    restart: unless-stopped

networks:
  # Created by the Docker-Raspberry-PI-Monitoring compose project (its `monitoring` network),
  # where the collector is reachable as otel-collector:4317.
  monitoring:
    external: true
    name: docker-raspberry-pi-monitoring_monitoring
  # Created by the cloudflared compose project; volkwyn-cloudflared-tunnel serves saas.volkwyn.nl from it.
  # The app trusts X-Forwarded-For from Docker networks (172.16.0.0/12, see
  # ForwardedHeaders:LocalProxyNetworks), which is why it must not publish a port: LAN clients
  # would then arrive from the bridge gateway and could forge their IP.
  tunnel:
    external: true
    name: cloudflared_default
